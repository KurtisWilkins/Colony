# =============================================================================
# Nginx reverse proxy configuration for Colony IoT Platform
#
# Proxies HTTP (port 80) and HTTPS (port 443) to Flask (port 5000).
# Enables access from the internet via No-IP dynamic DNS.
#
# Installation:
#   sudo cp nginx/iot-platform.conf /etc/nginx/sites-available/iot-platform
#   sudo ln -sf /etc/nginx/sites-available/iot-platform /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# For HTTPS with Let's Encrypt:
#   sudo certbot --nginx -d your-hostname.ddns.net
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    # Replace with your No-IP hostname or use _ for catch-all
    server_name shroomlord.3utilities.com _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for firmware updates, etc.)
    client_max_body_size 50M;

    # Proxy all requests to Flask
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static assets served by Flask
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
