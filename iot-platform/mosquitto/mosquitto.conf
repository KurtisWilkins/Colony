# =============================================================================
# Mosquitto Configuration - Location Pi
# =============================================================================
# This is the main configuration for the Mosquitto MQTT broker running on a
# location Pi. It serves as the local MQTT hub for all IoT devices at this
# physical location. Sensors, actuators, and other devices on the LAN publish
# and subscribe to topics through this broker.
# =============================================================================

# -----------------------------------------------------------------------------
# Network Listener
# -----------------------------------------------------------------------------
# Listen on port 1883 (the standard MQTT port) on all network interfaces
# (0.0.0.0). This makes the broker accessible to any device on the local
# network. If you want to restrict access to localhost only, change 0.0.0.0
# to 127.0.0.1.
listener 1883 0.0.0.0

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
# Allow clients to connect without providing a username and password. This is
# acceptable for a trusted local LAN where all devices are known and the
# network is isolated. For production environments exposed to untrusted
# networks, set this to false and configure a password file or authentication
# plugin instead.
allow_anonymous true

# -----------------------------------------------------------------------------
# Bridge Configuration (optional)
# -----------------------------------------------------------------------------
# To enable bridging from this location Pi to a master Pi, include the
# bridge configuration file. Uncomment the line below once bridge.conf has
# been created from the provided template (bridge.conf.template).
#include_dir /etc/mosquitto/conf.d
