; PlatformIO Project Configuration File
; Irrigation Controller — 16 Zone Relay Board
; ESP32 DevKit v1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3

build_flags =
    -DMQTT_MAX_PACKET_SIZE=2048
    -DCORE_DEBUG_LEVEL=0
